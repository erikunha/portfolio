name: Claude Review

on:
  issue_comment:
    types: [created]

concurrency:
  # Concurrency resolves at the RUN level, before a job's `if:` is evaluated, so
  # a run that will be skipped still takes a slot in whatever group it names.
  # The group therefore admits exactly what the job admits; anything the job
  # would skip gets an isolated per-run group it shares with nothing and can
  # never displace a review. A newer request supersedes a running one.
  #
  # This predicate MUST stay identical to the job's `if:` below. Concurrency
  # cannot read `env` or a job output, so the duplication is forced by the
  # platform; `__tests__/scripts/claude-review-predicate.test.ts` keeps the two
  # copies from drifting.
  group: >-
    ${{ (github.event_name == 'issue_comment' &&
    github.event.issue.pull_request &&
    contains(github.event.comment.body, '/claude-review') &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) &&
    format('claude-review-{0}', github.event.issue.number) ||
    format('claude-review-noop-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # The verdict guard reads PR conversation comments via the Issues API
  # (repos/:o/:r/issues/:n/comments), which is gated by `issues`, NOT by
  # `pull-requests`. Without it the call 403s, `set -e` aborts the assignment,
  # and the step reds on every run — a permanent false red on the gate itself.
  # Read-only: the guard never writes a comment.
  issues: read
  id-token: write
  actions: read

jobs:
  review:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Two checkouts, in this order, per the action's own docs/security.md:
      # "Do not check out an untrusted ref into the workspace root before this
      # action." The root is the default branch, so `.github/claude-review-prompt.md`
      # read from there is the default-branch copy by construction: a PR cannot
      # author the prompt its own reviewer runs on. The PR's files go in a
      # subdirectory reachable only through --add-dir below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: pr-head
          fetch-depth: 1

      # Fetched again so the prompt is the default branch's tip even if it moved
      # since the run began.
      - name: Materialise the trusted reviewer prompt from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git show "FETCH_HEAD:.github/claude-review-prompt.md" > /tmp/claude-review-prompt.md
          # A floor, not `test -s`: a truncated `git show` leaves a non-empty file
          # that would silently run the reviewer on a fragment of its prompt.
          bytes=$(wc -c < /tmp/claude-review-prompt.md)
          if [ "$bytes" -lt 4000 ]; then
            echo "prompt materialised at only ${bytes} bytes — expected the full reviewer prompt" >&2
            exit 1
          fi

      # `--add-dir` mounts pr-head as project scope, so an instruction-shaped file
      # the PR authored would arrive on the INSTRUCTION channel rather than the
      # data channel. Prose in the prompt is not a mechanism; deleting the files is.
      # The reviewer still sees every one of them in `gh pr diff`, which is where a
      # change to them belongs under review.
      - name: Strip instruction-shaped files from the mounted PR copy
        run: |
          set -euo pipefail

          # Matched by NAME across the whole subtree, not at the root only. The
          # CLI discovers CLAUDE.md and AGENTS.md in SUBDIRECTORIES too, so a PR
          # adding `lib/CLAUDE.md` walked straight past a strip that listed seven
          # fixed root paths — and past its own verification, which checked the
          # same seven and reported success.
          find pr-head \
            \( -name 'CLAUDE.md' -o -name 'AGENTS.md' -o -name 'copilot-instructions.md' \
               -o -name '.claude' -o -name '.agents' -o -name '.codex' -o -name '.cursor' \) \
            -prune -exec rm -rf {} +

          # Verified with the SAME predicate that did the removing. A verify loop
          # that enumerates paths independently drifts from the rm the moment one
          # of them is edited, and then passes while removing nothing.
          leftover=$(find pr-head \
            \( -name 'CLAUDE.md' -o -name 'AGENTS.md' -o -name 'copilot-instructions.md' \
               -o -name '.claude' -o -name '.agents' -o -name '.codex' -o -name '.cursor' \) \
            -print -quit)
          if [ -n "$leftover" ]; then
            echo "instruction-shaped path survived the strip: $leftover" >&2
            echo "  --add-dir mounts pr-head as project scope, so it would reach the" >&2
            echo "  reviewer on the instruction channel." >&2
            exit 1
          fi

      - name: Mark review start
        id: t0
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: /claude-review
          claude_args: >-
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --add-dir pr-head
            --append-system-prompt-file /tmp/claude-review-prompt.md

      # A cancelled run cannot finish its own progress comment, so the checklist
      # it posted at job start would stay on the PR as if it were a live review.
      # This marks it superseded rather than deleting it. `if: cancelled()` still
      # runs on a graceful cancel.
      - name: Mark this run's progress comment superseded if it was cancelled
        if: cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.t0.outputs.at }}
        run: |
          set -uo pipefail
          [ -z "${SINCE:-}" ] && exit 0

          id=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
            | jq -r "[.[][] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | sort_by(.created_at) | last | .id // empty") || exit 0
          [ -z "$id" ] || [ "$id" = "null" ] && exit 0

          gh api -X PATCH "repos/$REPO/issues/comments/$id" \
            -f body="_Superseded: this review was cancelled because a newer commit replaced the HEAD it was reading. Any finding it posted refers to that older SHA. See the review for the current head._" \
            >/dev/null 2>&1 || true
          echo "marked comment $id as superseded"

      # A review that posts nothing still exits 0, so the check renders green and
      # `pnpm claude-gate` reads verdict=none, indistinguishable from "ran and
      # found nothing". This step reds the job unless THIS run posted a verdict.
      #
      # It filters on created_at against a timestamp taken before the action, so
      # an earlier run's verdict cannot satisfy it. Its regex is the one
      # parseClaudeVerdict in scripts/check-claude-approval.ts uses, applied PER
      # LINE: a bolded verdict wrapped across a line break reds this guard while
      # the parser reads it, so the guard is strictly NARROWER than the parser.
      # The parser reads only the LATEST claude[bot] comment, so the filter sorts
      # and takes `last`. `--slurp` is load-bearing: it makes gh emit ONE array of
      # pages, the shape `.[][]` destructures; without it `last` yields one body
      # per page. gh refuses `--slurp` together with `--jq`, so the filter is a
      # real jq.
      - name: Assert this run posted a verdict the gate can read
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.t0.outputs.at }}
        run: |
          set -euo pipefail

          if [ -z "${SINCE:-}" ]; then
            echo "FAIL: no review-start timestamp, so freshness cannot be established."
            echo "  jq compares strings, and .created_at >= \"\" is true for every comment,"
            echo "  so continuing here would silently accept a PREVIOUS run's verdict."
            exit 1
          fi

          # The action posts a progress comment at job start and EDITS the verdict
          # into it at the end, so created_at selects the comment long before its
          # body carries a verdict. Re-read rather than judging one snapshot.
          for attempt in 1 2 3 4 5; do
            # `|| fresh=""` contains a transient gh failure: under `set -euo
            # pipefail` a rate limit or 5xx would otherwise abort the step on
            # whichever attempt it lands and defeat the retry loop.
            fresh=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
              | jq -r "[.[][] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | sort_by(.created_at) | last | .body // empty") || fresh=""

            if printf '%s' "$fresh" | grep -qiE '\*\*[^*]*\b(approve|reject|request changes)\b[^*]*\*\*'; then
              echo "OK  this run posted a verdict (attempt $attempt)."
              exit 0
            fi
            [ "$attempt" -lt 5 ] && sleep "${VERDICT_RETRY_SLEEP:-10}"
          done
          echo "FAIL: claude-review posted no verdict on PR #$PR during this run."
          echo "  The action exits 0 regardless, so without this step the check would read"
          echo "  green while claude-gate sees verdict=none."
          echo "  Known cause: tag mode returns a progress checklist instead of a review."
          echo "  Comment /claude-review again to retry."
          exit 1
