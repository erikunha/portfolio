name: Weekly Metrics

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      weeks:
        description: "Weeks to collect. Blank: the weeks missing since the last run, or a quarter on the first run."
        required: false
        default: ""
        type: string

concurrency:
  group: weekly-metrics
  cancel-in-progress: false

permissions: {}

jobs:
  metrics:
    name: Collect, band-check and report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      deployments: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Find the previous history artifact
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow weekly-metrics.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run_id=${id}" >> "$GITHUB_OUTPUT"

      - name: Download the previous history
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metrics-weekly
          path: metrics
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the previous history
        if: steps.previous.outputs.run_id != ''
        run: test -s metrics/weekly.json

      - name: Collect the week
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEKS: ${{ inputs.weeks }}
        run: node scripts/metrics/collect.mjs ${WEEKS:+--weeks "$WEEKS"}

      - name: Check the bands
        run: node scripts/metrics/bands.mjs

      - name: Keep the history
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics-weekly
          path: |
            metrics/weekly.json
            metrics/breaches.json
          retention-days: 90
          if-no-files-found: error

      - name: Open or update breach issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/metrics/issues.mjs
