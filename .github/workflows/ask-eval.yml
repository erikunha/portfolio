name: Ask Eval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # 05:00 UTC every Monday, an hour ahead of agent-eval

concurrency:
  group: ask-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ask-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EVAL_PUBLISH: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
    steps:
      - name: Require the restricted publish credentials
        if: env.EVAL_PUBLISH == '1'
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.EVAL_PUBLISH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.EVAL_PUBLISH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "$UPSTASH_REDIS_REST_URL" ] || [ -z "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo "::error::EVAL_PUBLISH_REDIS_REST_URL and EVAL_PUBLISH_REDIS_REST_TOKEN must be set as repository secrets (the Redis ACL user that can only SET ask:eval:latest and agent-eval:latest), or the result is never published"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Ask eval suite (republishes ask:eval:latest so AI_METRICS cannot go stale)
        run: pnpm ask:eval
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY_BUILD }}
          UPSTASH_REDIS_REST_URL: ${{ env.EVAL_PUBLISH == '1' && secrets.EVAL_PUBLISH_REDIS_REST_URL || '' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ env.EVAL_PUBLISH == '1' && secrets.EVAL_PUBLISH_REDIS_REST_TOKEN || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ask-eval-result-scheduled
          path: ask-eval-result.json
