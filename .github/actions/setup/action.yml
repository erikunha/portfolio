name: Setup
description: Install pnpm and Node from the repository pins, then install dependencies from the frozen lockfile.

inputs:
  cache:
    description: Restore and save the pnpm store through actions/setup-node. Set to "false" for a job that must not touch the cache.
    required: false
    default: "true"
  install:
    description: Run pnpm install --frozen-lockfile. Set to "false" for a job that resolves or installs on its own terms.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".nvmrc"
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}

    - name: Install
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
