name: Ask Eval

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # 05:00 UTC every Monday, an hour ahead of agent-eval

concurrency:
  group: ask-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ask-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Ask eval suite (republishes ask:eval:latest so AI_METRICS cannot go stale)
        run: pnpm ask:eval
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY_BUILD }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ask-eval-result-scheduled
          path: ask-eval-result.json
