name: Claude Review

on:
  issue_comment:
    types: [created]
  # `pull_request`, NOT `pull_request_target`, and this was tried the other way.
  # `pull_request_target` fires reliably, but Anthropic's token exchange REJECTS
  # the OIDC token minted under it: `App token exchange failed: 401 Unauthorized
  # - Invalid OIDC token`, deterministic across four runs and two checkout
  # layouts, posting nothing. The OIDC token is obtained fine — the exchange is
  # what refuses — so it is a server-side policy we cannot change from here.
  #
  # `github_token:` would bypass the exchange, but the token it supplies posts as
  # `github-actions[bot]` instead of `claude[bot]`, and 14 surfaces key on that
  # identity including `check-claude-approval.ts`, which IS the merge gate. Too
  # high a price for a trigger.
  #
  # The known cost of `pull_request`: GitHub loads the workflow from the PR HEAD,
  # so a PR editing THIS file runs a modified copy and the action refuses. Those
  # PRs need one `/claude-review` comment, which runs the default-branch copy.
  # The verdict guard's carve-out below exists for exactly that case.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Concurrency resolves at the RUN level, before a job's `if:` is evaluated, so
  # a run that will be skipped still takes a slot in whatever group it names.
  # Two earlier attempts got this wrong: sharing one group per PR let a
  # phrase-free comment cancel a live review (#221, "Canceling since a higher
  # priority waiting request for claude-review-221 exists"), and turning
  # cancellation off only shielded a RUNNING victim, since a PENDING run is
  # replaced regardless of that flag.
  #
  # So the group admits exactly what the job admits. Anything the job would skip
  # gets an isolated per-run group it shares with nothing and can never displace
  # a review. Cancellation is then correct again: a review is only valid against
  # the HEAD it read, so a newer push should supersede it.
  #
  # This predicate MUST stay identical to the job's `if:` below. Concurrency
  # cannot read `env` or a job output, so the duplication is forced by the
  # platform; `__tests__/scripts/claude-review-predicate.test.ts` is what keeps
  # the two copies from drifting. `draft == false` must stay INSIDE the
  # pull_request branch, never in the top-level disjunction: GHA casts null
  # to false, so a top-level draft check is true on a comment event and would
  # admit every comment. Membership in that branch is what matters, not
  # position within it; `&&` is order-independent.
  group: >-
    ${{ ((github.event_name == 'pull_request' &&
    github.event.pull_request.draft == false &&
    github.event.pull_request.user.type != 'Bot' &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
    (github.event_name == 'issue_comment' &&
    github.event.issue.pull_request &&
    contains(github.event.comment.body, '/claude-review') &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) &&
    format('claude-review-{0}', github.event.pull_request.number || github.event.issue.number) ||
    format('claude-review-noop-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # The verdict guard reads PR conversation comments via the Issues API
  # (repos/:o/:r/issues/:n/comments), which is gated by `issues`, NOT by
  # `pull-requests`. Without it the call 403s, `set -e` aborts the assignment,
  # and the step reds on every run — a permanent false red on the gate itself.
  # Read-only: the guard never writes a comment.
  issues: read
  id-token: write
  actions: read

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Two checkouts, in this order, per the action's own docs/security.md:
      # "Do not check out an untrusted ref into the workspace root before this
      # action." The first version of this workflow did exactly that and the
      # action died at `App token exchange failed: 401 Unauthorized - Invalid
      # OIDC token` on every run — it expects a git repo at the root and restores
      # project configuration from the base ref.
      #
      # It also makes the trust model structural instead of bolted on. The root
      # is the BASE, so `.github/claude-review-prompt.md` read from there is the
      # default-branch copy by construction: a PR cannot author the prompt its own
      # reviewer runs on, which is what the earlier /tmp materialisation step
      # existed to guarantee and no longer needs to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PINNED to the base explicitly. Under `pull_request` the DEFAULT ref is
          # `refs/pull/N/merge` — PR code — so omitting this silently inverts the
          # trust model: the root would hold content the PR authored, and every
          # convention file read from it would be the PR's. Under
          # `pull_request_target` the default happened to be the base, which is
          # why the earlier revision could leave it off; that is not true here.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1

      # The PR's files, in a SUBDIRECTORY, reachable only through --add-dir below.
      # `refs/pull/N/head` resolves on both the pull_request and the
      # issue_comment path, where no `pull_request.head.sha` exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          path: pr-head
          fetch-depth: 1

      # `pull_request_target` sets the root to the PR's BASE, which is NOT the
      # default branch on a sub-PR into an integration branch — a flow CLAUDE.md
      # documents. Once one sub-PR lands a prompt edit in `feat/x`, every later
      # `feat/x-part` review would load the prompt that branch authored. The
      # layout gives base; only this gives DEFAULT branch, so the two are
      # orthogonal and an earlier revision was wrong to treat them as alternatives.
      - name: Materialise the trusted reviewer prompt from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git show "FETCH_HEAD:.github/claude-review-prompt.md" > /tmp/claude-review-prompt.md
          # A floor, not `test -s`: a truncated `git show` leaves a non-empty file
          # that would silently run the reviewer on a fragment of its prompt.
          bytes=$(wc -c < /tmp/claude-review-prompt.md)
          if [ "$bytes" -lt 4000 ]; then
            echo "prompt materialised at only ${bytes} bytes — expected the full reviewer prompt" >&2
            exit 1
          fi

      # `--add-dir` mounts pr-head as project scope, so an instruction-shaped file
      # the PR authored would arrive on the INSTRUCTION channel rather than the
      # data channel. Prose in the prompt is not a mechanism; deleting the files is.
      # The reviewer still sees every one of them in `gh pr diff`, which is where a
      # change to them belongs under review.
      - name: Strip instruction-shaped files from the mounted PR copy
        run: |
          set -euo pipefail

          # Matched by NAME across the whole subtree, not at the root only. The
          # CLI discovers CLAUDE.md and AGENTS.md in SUBDIRECTORIES too, so a PR
          # adding `lib/CLAUDE.md` walked straight past a strip that listed seven
          # fixed root paths — and past its own verification, which checked the
          # same seven and reported success.
          find pr-head \
            \( -name 'CLAUDE.md' -o -name 'AGENTS.md' -o -name 'copilot-instructions.md' \
               -o -name '.claude' -o -name '.agents' -o -name '.codex' -o -name '.cursor' \) \
            -prune -exec rm -rf {} +

          # Verified with the SAME predicate that did the removing. A verify loop
          # that enumerates paths independently drifts from the rm the moment one
          # of them is edited, and then passes while removing nothing.
          leftover=$(find pr-head \
            \( -name 'CLAUDE.md' -o -name 'AGENTS.md' -o -name 'copilot-instructions.md' \
               -o -name '.claude' -o -name '.agents' -o -name '.codex' -o -name '.cursor' \) \
            -print -quit)
          if [ -n "$leftover" ]; then
            echo "instruction-shaped path survived the strip: $leftover" >&2
            echo "  --add-dir mounts pr-head as project scope, so it would reach the" >&2
            echo "  reviewer on the instruction channel." >&2
            exit 1
          fi

      - name: Mark review start
        id: t0
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: /claude-review
          # track_progress and prompt are a PAIR, not alternatives. detectMode
          # reads track_progress before the prompt branches, so the prompt no
          # longer costs tag mode; without the prompt, tag mode's trigger gate
          # falls back to scanning the PR title and body for the phrase, finds
          # nothing, and returns before any review runs. Either one alone exits
          # green having posted nothing.
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: "${{ github.event_name == 'pull_request' && format('REPO {0} — PR NUMBER {1} — You are performing a CODE REVIEW, not a task. Do not narrate progress and do not implement changes. Produce exactly two artifacts: one create_inline_comment tool call per finding, and then one overview comment ending in exactly one verdict line. Read the diff with gh pr diff. A run that posts no verdict line has failed.', github.repository, github.event.pull_request.number) || '' }}"
          claude_args: >-
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --add-dir pr-head
            --append-system-prompt-file /tmp/claude-review-prompt.md

      # A review that posts nothing still exits 0, so the check renders green and
      # check-claude-approval.ts reads verdict=none — indistinguishable from "ran
      # and found nothing". That silent-green cost hours across #221-#223, and on
      # the pull_request path it was permanent: tag mode posted a track_progress
      # checklist with no verdict on every auto-run, so the merge gate never had
      # anything to read.
      #
      # Two things this must NOT do. It must not accept a verdict from an EARLIER
      # run, or a push whose review posted nothing passes on the previous head's
      # verdict — so it filters on created_at against a timestamp taken before the
      # action. And it must not use its own looser pattern than the gate it
      # protects: parseClaudeVerdict in scripts/check-claude-approval.ts requires
      # the verdict word inside ** **, so an unbolded "approve" would satisfy a
      # naive grep while the gate still read none. The regex below is that
      # parser's regex, with one asymmetry that must stay visible: grep applies it
      # PER LINE and JS [^*] matches a newline, so a bolded verdict wrapped across
      # a line break reds this guard while the merge gate reads approve. The guard
      # is therefore strictly NARROWER than the parser PATTERN-FOR-PATTERN. The
      # corpora must match too: the gate reads only the LATEST claude[bot] comment,
      # so the filter sorts and takes `last`. --slurp is load-bearing, not decoration:
      # --slurp makes gh emit ONE array of pages instead of a filtered result per
      # page, which is the shape the `.[][]` filter destructures; without it `last`
      # yields one body per page and the guard greps their union — the very failure
      # `last` was added to remove, reappearing only once a PR passes 30 comments.
      # A cancelled run cannot finish its own progress comment, so the checklist
      # it posted at job start is orphaned on the PR forever. That is not
      # cosmetic: three of them accumulated on #229 and read as three live
      # reviews. Cancellation is normal here — the concurrency group supersedes a
      # review whose HEAD was replaced — so the litter is guaranteed, not rare.
      #
      # Marks rather than deletes: the run happened, and a reader tracing why a
      # finding appeared against an older SHA needs to see that it was superseded
      # rather than find a gap. `if: cancelled()` still runs on a graceful cancel.
      - name: Mark this run's progress comment superseded if it was cancelled
        if: cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.t0.outputs.at }}
        run: |
          set -uo pipefail
          [ -z "${SINCE:-}" ] && exit 0

          id=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
            | jq -r "[.[][] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | sort_by(.created_at) | last | .id // empty") || exit 0
          [ -z "$id" ] || [ "$id" = "null" ] && exit 0

          gh api -X PATCH "repos/$REPO/issues/comments/$id" \
            -f body="_Superseded: this review was cancelled because a newer commit replaced the HEAD it was reading. Any finding it posted refers to that older SHA. See the review for the current head._" \
            >/dev/null 2>&1 || true
          echo "marked comment $id as superseded"

      - name: Assert this run posted a verdict the merge gate can read
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.t0.outputs.at }}
        run: |
          set -euo pipefail

          # Reinstated with the `pull_request` trigger. GitHub loads a
          # `pull_request` workflow from the PR head, so the action refuses on any
          # PR editing this file and NO verdict can exist to assert — a red no
          # amount of fixing could clear, which trains override. It was correctly
          # deleted while the trigger was `pull_request_target`, where the action
          # never refuses; it is correctly back now. The `issue_comment` path is
          # deliberately NOT skipped: it runs the default-branch copy, so it can
          # and must post a verdict.
          # Captured first, NOT piped into the condition. `grep -q` exits on its
          # first match while `gh` is still writing, `gh` dies of SIGPIPE (141),
          # and `pipefail` makes the pipeline status 141 — so the `if` is false
          # and the skip is bypassed on exactly the PRs it exists for. This file
          # sorts near the front of `--name-only`, so the match is early and the
          # race is likely, but it depends on write buffering: nondeterministic.
          # Guarded with a diagnostic, not left to `set -e`. An unguarded failure
          # aborts the whole step with an opaque error even when the review already
          # posted a valid verdict, blocking the merge gate with nothing to read.
          # Not defaulted to empty either: that silently decides "does not edit the
          # workflow", which is the skip decision this line exists to make.
          if ! changed_files=$(gh pr diff "$PR" --name-only); then
            echo "FAIL: could not read the changed files for PR #$PR." >&2
            echo "  Whether this PR edits claude-review.yml is therefore unknown, and" >&2
            echo "  that decides whether a missing verdict is expected or a real failure." >&2
            echo "  Re-run the job; this is usually a transient gh/API error." >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
            && grep -qx '.github/workflows/claude-review.yml' <<<"$changed_files"; then
            echo "SKIP  this PR edits claude-review.yml."
            echo "  The action refuses when the workflow differs from the default branch,"
            echo "  so the auto path cannot post a verdict here no matter what the PR does."
            echo "  Use one /claude-review comment, which runs the default-branch copy."
            exit 0
          fi

          if [ -z "${SINCE:-}" ]; then
            echo "FAIL: no review-start timestamp, so freshness cannot be established."
            echo "  jq compares strings, and .created_at >= \"\" is true for every comment,"
            echo "  so continuing here would silently accept a PREVIOUS run's verdict."
            exit 1
          fi

          # The action posts a progress comment at job start and EDITS the verdict
          # into it at the end, so created_at selects the comment long before its
          # body carries a verdict. Re-read rather than judging one snapshot: a
          # single fetch raced the final edit by one second and failed a review
          # that had posted a valid "**Verdict: Request changes.**".
          for attempt in 1 2 3 4 5; do
            # `|| fresh=""` contains a transient failure. Under `set -euo pipefail`
            # any rate limit, 5xx, or network blip aborts the whole step on
            # whichever attempt it lands, which defeats the retry loop and replaces
            # the FAIL diagnostic with an opaque pipefail error — a false red on the
            # merge gate over an Approve that was already posted. The retry only
            # became reachable when the fetch below was fixed, so this was latent.
            #
            # Piped to jq, NOT gh's --jq: gh REFUSES `--slurp` alongside any
            # filter flag (`--jq`, `-q`, `--template`), writing the message to
            # stderr and exiting 1 — so under `set -euo pipefail` the step aborted
            # at this assignment and neither the retry loop nor the FAIL
            # diagnostic below was ever reached. --slurp is still load-bearing:
            # it makes gh emit ONE array of pages, which is the shape `.[][]`
            # destructures; without it the filter sees each page separately and
            # `last` yields one body per page. So the filter moves to a real jq.
            fresh=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
              | jq -r "[.[][] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | sort_by(.created_at) | last | .body // empty") || fresh=""

            if printf '%s' "$fresh" | grep -qiE '\*\*[^*]*\b(approve|reject|request changes)\b[^*]*\*\*'; then
              echo "OK  this run posted a verdict (attempt $attempt)."
              exit 0
            fi
            [ "$attempt" -lt 5 ] && sleep "${VERDICT_RETRY_SLEEP:-10}"
          done
          echo "FAIL: claude-review posted no verdict on PR #$PR during this run."
          echo "  The action exits 0 regardless, so without this step the check would read"
          echo "  green while check-claude-approval.ts sees verdict=none and the merge gate"
          echo "  stalls with no explanation."
          echo "  Known cause: tag mode returns a progress checklist instead of a review."
          echo "  Re-run the failed job. Do NOT comment /claude-review: both paths already"
          echo "  run the default-branch copy, and the comment lands in this run's concurrency"
          echo "  group and cancels whatever is in flight."
          exit 1
