name: Ask Eval

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # 05:00 UTC every Monday, an hour ahead of agent-eval

concurrency:
  group: ask-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ask-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Ask eval suite (republishes ask:eval:latest so AI_METRICS cannot go stale)
        run: pnpm ask:eval
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY_BUILD }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ask-eval-result-scheduled
          path: ask-eval-result.json
