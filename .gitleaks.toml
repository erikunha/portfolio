title = "gitleaks configuration"

[extend]
useDefault = true

# NO ALLOWLIST IN THIS FILE MAY USE `paths`. A `paths` entry exempts the file from EVERY
# rule, which makes it a permanent secret-laundering path: a real credential committed there
# would be invisible to the scanner forever. Allowlist the VALUE, never the file.
# scripts/gates/check-gitleaks-fixture.ts fails the build if a `paths` key reappears here.

[[allowlists]]
description = "HISTORY ONLY. These fake GitHub tokens are no longer in the tree, but the first commit still carries them (the sanitize-secrets test) and the secret scan reads every commit, so the exemption has to keep naming them (generic-api-key false positives)"
regexes = ['''^gh[psour]_AbCdEf0123456789012345$''']

# Both fixtures plant a fake-but-real-shaped secret on purpose, to prove their scanner FIRES.
# These allowlists exempt the planted VALUE, not the file.
#
# Measured on gitleaks 8.30: ANY `paths` entry exempts the file from EVERY rule, and neither
# `condition = "AND"` nor `matchCondition = "AND"` narrows that -- both still allowlist the
# whole file. A path-scoped entry would therefore make these two fixtures permanent
# secret-laundering paths: a REAL credential parked in one of them would be invisible to the
# scanner forever. A `regexes`-only entry does not have that property, so any other secret in
# the same file is still caught. Verified both ways in scripts/__tests__.
#
# The exempted values are fake and we own them, so exempting them repo-wide costs nothing.
[[allowlists]]
description = "Planted token proving gitleaks fires (scripts/gates/check-gitleaks-fixture.ts asserts it is detected)"
regexes = ['''ghp_R2d2c3poAbCdEfGhIjKlMnOpQrStUvWx1234''']

[[allowlists]]
description = "HISTORY ONLY. This value is no longer in the tree: the vendored secret rule watches for an Anthropic key now (DECISIONS.md 2026-11-11), and the Stripe one was dropped because this repository has no Stripe code. It is still in the published history, and the secret scan reads every commit, so the exemption has to keep naming it."
regexes = ['''sk_test_51HxFakeFixtureTokenABCDEFGHIJ''']

[[allowlists]]
description = "Planted token proving semgrep fires (scripts/gates/check-semgrep-fixture.ts asserts hardcoded-anthropic-api-key)"
regexes = ['''sk-ant-api03-4ISu6Ooxjf89GsKUoIzjzkg8OloU2EGM_77qzvv1Tx8_y0KerI5ZspIdYWiQB-y5S-0KCcFS9IaAuZwNoWGK-2hjmScpJAA''']

[[allowlists]]
description = "CSS design token names (secondary-NNN), not secrets (generic-api-key false positives)"
regexes = ['''^secondary-\d{2,3}$''']

[[allowlists]]
description = "The p95LatencyMs metric key (content/measured.ts, lib/ask/metrics.ts), an identifier and not a secret (generic-api-key false positive)"
regexes = ['''^p95LatencyMs$''']

[[allowlists]]
description = "HISTORY ONLY. This fake cron secret fixture (app/api/error-digest tests) is no longer in the tree. It stays in local unpushed commits, which are not rewritten without the owner, and the secret scan reads every commit (generic-api-key false positive)."
regexes = ['''^test-cron-secret-0123456789$''']

[[allowlists]]
description = "HISTORY ONLY. This fake Stripe-shaped query token (app/api/error-digest/route.urls.test.ts) is no longer in the tree. It stays in local unpushed commits, which are not rewritten without the owner, and the secret scan reads every commit (stripe-access-token false positive)."
regexes = ['''^sk_live_9f8e7d6c5b4a$''']
