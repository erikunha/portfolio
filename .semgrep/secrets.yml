rules:
  - id: hardcoded-anthropic-api-key
    languages: [typescript, javascript]
    severity: ERROR
    message: Hardcoded Anthropic API key. Move to an environment variable.
    pattern-regex: sk-ant-api03-[A-Za-z0-9_-]{93,}
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-Coded Credentials"
