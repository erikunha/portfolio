name: Lockfile Resolution Probe

# pnpm refuses any version younger than minimumReleaseAge (pnpm-workspace.yaml) at install time.
# When every version in a dependency's range is still inside that window, resolution fails with
# ERR_PNPM_NO_MATURE_MATCHING_VERSION, and so does the Dependabot update that needs it. CI installs
# with --frozen-lockfile and never resolves, so nothing else reports it. This weekly job resolves
# every range from scratch in a throwaway checkout (the lockfile is removed first, nothing is
# committed or installed) and keeps one open issue while resolution is blocked.

on:
  schedule:
    - cron: "0 8 * * 1" # Weekly Monday 08:00 UTC
  workflow_dispatch:

concurrency:
  group: lockfile-resolution-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: Every range resolves inside the release-age window
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Resolve every range without a lockfile
        id: probe
        run: |
          rm -f pnpm-lock.yaml
          set +e
          pnpm install --lockfile-only --ignore-scripts > probe.log 2>&1
          status=$?
          set -e
          cat probe.log
          if grep -q ERR_PNPM_NO_MATURE_MATCHING_VERSION probe.log; then
            echo "outcome=blocked" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ]; then
            echo "outcome=clear" >> "$GITHUB_OUTPUT"
          else
            echo "::error::pnpm install --lockfile-only failed for a reason other than the release-age window (exit $status)."
            exit "$status"
          fi

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.probe.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: Dependency resolution is blocked by the release-age window
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")

          if [ "$OUTCOME" = "blocked" ]; then
            {
              echo "Resolving every range from scratch failed with ERR_PNPM_NO_MATURE_MATCHING_VERSION: no version in some range is older than minimumReleaseAge."
              echo
              echo "Run: $RUN_URL"
              echo
              echo '```'
              grep -B2 -A6 ERR_PNPM_NO_MATURE_MATCHING_VERSION probe.log | head -40
              echo '```'
              echo
              echo "Wait for the version to age past the window. If it carries a security fix, list that one package in minimumReleaseAgeExclude and remove the entry once the window has passed (DECISIONS.md)."
            } > body.md
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file body.md
            else
              gh issue create --title "$ISSUE_TITLE" --body-file body.md
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Resolution works again: $RUN_URL"
            gh issue close "$number" --reason completed
          fi
