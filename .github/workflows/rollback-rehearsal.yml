name: Rollback Rehearsal

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: rollback-rehearsal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rehearse:
    name: Revert the latest commit on main and rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Revert the latest commit on main locally
        run: |
          git config user.name "rollback-rehearsal"
          git config user.email "rollback-rehearsal@users.noreply.github.com"
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$parents" -gt 2 ]; then
            git revert -m 1 --no-edit HEAD
          else
            git revert --no-edit HEAD
          fi
          git log --oneline -n 2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          DEPLOY_SALT: ci-build-salt
          E2E_LINKS_FEED_FIXTURE: tests/e2e/fixtures/links-feed.json

  report:
    name: Open or update the failure issue
    needs: rehearse
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: Rollback rehearsal failed
        run: |
          body="The weekly rollback rehearsal could not revert the latest commit on main and rebuild it. A real rollback would fail the same way. Run: ${RUN_URL}"
          number=$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number,title \
            | jq -r --arg title "${ISSUE_TITLE}" 'map(select(.title == $title)) | first | .number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing. ${body}"
          else
            gh issue create --title "${ISSUE_TITLE}" --body "${body}"
          fi
