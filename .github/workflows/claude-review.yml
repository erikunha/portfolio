name: Claude Review

on:
  issue_comment:
    types: [created]

concurrency:
  # Concurrency resolves at the RUN level, before a job's `if:` is evaluated, so
  # a run that will be skipped still takes a slot in whatever group it names.
  # The group therefore admits exactly what the job admits; anything the job
  # would skip gets an isolated per-run group it shares with nothing and can
  # never displace a review. A newer request supersedes a running one.
  #
  # This predicate MUST stay identical to the job's `if:` below. Concurrency
  # cannot read `env` or a job output, so the duplication is forced by the
  # platform; `__tests__/scripts/claude-review-predicate.test.ts` keeps the two
  # copies from drifting.
  group: >-
    ${{ (github.event_name == 'issue_comment' &&
    github.event.issue.pull_request &&
    contains(github.event.comment.body, '/claude-review') &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) &&
    format('claude-review-{0}', github.event.issue.number) ||
    format('claude-review-noop-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # The verdict guard reads PR conversation comments via the Issues API
  # (repos/:o/:r/issues/:n/comments), which is gated by `issues`, NOT by
  # `pull-requests`. Without it the call 403s, `set -e` aborts the assignment,
  # and the step reds on every run: a permanent false red on the gate itself.
  # Read-only: the guard never writes a comment.
  issues: read
  # The evidence snapshot runs `gh pr checks`, which reads check runs and
  # commit statuses; without these two it fails on every run and the reviewer
  # sees no gate results.
  checks: read
  statuses: read
  id-token: write
  actions: read

jobs:
  review:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # Two checkouts, in this order, per the action's own docs/security.md:
      # "Do not check out an untrusted ref into the workspace root before this
      # action." The root is the default branch, so `.github/claude-review-prompt.md`
      # read from there is the default-branch copy by construction: a PR cannot
      # author the prompt its own reviewer runs on. The PR's files go in a
      # subdirectory reachable only through --add-dir below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: pr-head
          fetch-depth: 1
          persist-credentials: false

      # Fetched again so the prompt is the default branch's tip even if it moved
      # since the run began.
      - name: Materialise the trusted reviewer prompt from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git show "FETCH_HEAD:.github/claude-review-prompt.md" > /tmp/claude-review-prompt.md
          # A floor, not `test -s`: a truncated `git show` leaves a non-empty file
          # that would silently run the reviewer on a fragment of its prompt.
          bytes=$(wc -c < /tmp/claude-review-prompt.md)
          if [ "$bytes" -lt 4000 ]; then
            echo "prompt materialised at only ${bytes} bytes, expected the full reviewer prompt" >&2
            exit 1
          fi

      # The review orchestrator's procedure is read from the DEFAULT branch for the same
      # reason as the prompt above: on a sub-PR the base is an integration branch whose
      # copy that branch authored. It lands outside pr-head, so the strip never sees it.
      - name: Materialise the trusted review orchestrator from the default branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/review-skill
          if ! git cat-file -e FETCH_HEAD:.claude/skills/pr-review-orchestrator/SKILL.md 2>/dev/null; then
            echo "::notice::the default branch has no review orchestrator yet; the reviewer runs without it"
            exit 0
          fi
          git archive FETCH_HEAD:.claude/skills/pr-review-orchestrator | tar -x -C /tmp/review-skill
          test -s /tmp/review-skill/SKILL.md
          test -s /tmp/review-skill/references/ci.md

      # PR metadata and gate results are snapshotted here with the workflow token, so
      # the reviewer holds no `gh` command that takes `--jq`: a jq filter can read the
      # process environment, and the reviewer's environment holds its OAuth token. No
      # PR code runs in this job, so dependency source is not installed; ci.md says
      # what that leaves to the local orchestrator.
      - name: Snapshot PR metadata and CI gate results for the reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          OUT_DIR: /tmp/review-evidence
        run: |
          set -euo pipefail

          : "${REPO:?REPO is required}"
          : "${PR:?PR is required}"
          : "${OUT_DIR:?OUT_DIR is required}"
          MAX_LOG_BYTES="${MAX_LOG_BYTES:-60000}"
          MAX_FAILED_RUNS="${MAX_FAILED_RUNS:-5}"
          GH_PR_CHECKS_FAILED=1
          GH_PR_CHECKS_PENDING=8

          mkdir -p "$OUT_DIR"

          head_sha=""
          if gh pr view "$PR" --repo "$REPO" --json number,headRefOid,baseRefName,headRefName,title \
            > "$OUT_DIR/pr.json" 2> "$OUT_DIR/pr.err"; then
            head_sha=$(jq -r '.headRefOid // empty' "$OUT_DIR/pr.json" 2> /dev/null || true)
            if [ -z "$head_sha" ]; then
              echo "UNAVAILABLE: pr.json has no readable headRefOid." > "$OUT_DIR/pr-unavailable.txt"
            fi
          else
            {
              echo "UNAVAILABLE: gh pr view failed; PR metadata and the head SHA could not be read."
              cat "$OUT_DIR/pr.err"
            } > "$OUT_DIR/pr-unavailable.txt"
            rm -f "$OUT_DIR/pr.json"
          fi
          rm -f "$OUT_DIR/pr.err"

          if [ -z "$head_sha" ]; then
            head_sha=$(git -C pr-head rev-parse HEAD 2> /dev/null || true)
            if [ -n "$head_sha" ]; then
              printf '%s\n' "$head_sha" > "$OUT_DIR/head-sha.txt"
            fi
          fi

          if ! { gh pr diff "$PR" --repo "$REPO" > "$OUT_DIR/diff.patch" \
            && gh pr diff "$PR" --repo "$REPO" --name-only > "$OUT_DIR/files.txt"; } 2> "$OUT_DIR/diff.err"; then
            if ! { gh api "repos/$REPO/pulls/$PR/files" --paginate > "$OUT_DIR/files.json" \
              && jq -sr '.[][] | .filename' "$OUT_DIR/files.json" > "$OUT_DIR/files.txt" \
              && jq -sr '.[][] | "diff --git a/\(.filename) b/\(.filename)\n" + (.patch // "# patch omitted by GitHub: \(.filename)")' \
                "$OUT_DIR/files.json" > "$OUT_DIR/diff.patch"; } 2> "$OUT_DIR/files.err"; then
              echo "::error::gh pr diff failed; there is nothing to review, so the job stops instead of approving blind."
              cat "$OUT_DIR/diff.err" "$OUT_DIR/files.err" >&2
              exit 1
            fi
            rm -f "$OUT_DIR/files.json" "$OUT_DIR/files.err"
          fi
          rm -f "$OUT_DIR/diff.err"

          checks_status=0
          gh pr checks "$PR" --repo "$REPO" --json name,state,bucket,link \
            > "$OUT_DIR/checks.json" 2> "$OUT_DIR/checks.err" || checks_status=$?
          checks_valid=false
          case "$checks_status" in
            0 | "$GH_PR_CHECKS_FAILED" | "$GH_PR_CHECKS_PENDING")
              if jq -e 'type == "array" and length > 0' "$OUT_DIR/checks.json" > /dev/null 2>&1; then
                checks_valid=true
              fi
              ;;
          esac
          if [ "$checks_valid" = true ]; then
            jq -r '.[] | [.bucket, .state, .name, .link] | @tsv' "$OUT_DIR/checks.json" > "$OUT_DIR/checks.txt"
          else
            {
              echo "UNAVAILABLE: gh pr checks exited $checks_status without a readable check list."
              cat "$OUT_DIR/checks.err"
            } > "$OUT_DIR/checks.txt"
          fi
          rm -f "$OUT_DIR/checks.err" "$OUT_DIR/checks.json"

          run_ids=""
          if [ -z "$head_sha" ]; then
            echo "UNAVAILABLE: no head SHA, so failed-run logs were not looked up." \
              > "$OUT_DIR/failed-runs-unavailable.txt"
          elif ! run_ids=$(gh run list --repo "$REPO" --commit "$head_sha" --status failure --limit "$MAX_FAILED_RUNS" \
            --json databaseId --jq '.[].databaseId' 2> "$OUT_DIR/runs.err"); then
            {
              echo "UNAVAILABLE: gh run list failed; failed-run logs could not be read."
              cat "$OUT_DIR/runs.err"
            } > "$OUT_DIR/failed-runs-unavailable.txt"
            run_ids=""
          fi
          rm -f "$OUT_DIR/runs.err"
          for run_id in $run_ids; do
            full="$OUT_DIR/.failed-run-${run_id}.full"
            gh run view "$run_id" --repo "$REPO" --log-failed > "$full" 2>&1 || true
            head -c "$MAX_LOG_BYTES" "$full" > "$OUT_DIR/failed-run-${run_id}.log"
            rm -f "$full"
          done

      # `--add-dir` mounts pr-head as project scope, so an instruction-shaped file
      # the PR authored would arrive on the INSTRUCTION channel rather than the
      # data channel. Prose in the prompt is not a mechanism; deleting the files is.
      # The reviewer still sees every one of them in `gh pr diff`, which is where a
      # change to them belongs under review.
      - name: Strip instruction-shaped files from the mounted PR copy
        run: |
          set -euo pipefail

          # Matched by NAME across the whole subtree, not at the root only. The
          # CLI discovers CLAUDE.md and AGENTS.md in SUBDIRECTORIES too, so a PR
          # adding `lib/CLAUDE.md` walked straight past a strip that listed seven
          # fixed root paths, and past its own verification, which checked the
          # same seven and reported success.
          find pr-head \
            \( -name 'CLAUDE.md' -o -name 'AGENTS.md' -o -name 'copilot-instructions.md' \
               -o -name '.claude' -o -name '.agents' -o -name '.codex' -o -name '.cursor' \) \
            -prune -exec rm -rf {} +

          # Verified with the SAME predicate that did the removing. A verify loop
          # that enumerates paths independently drifts from the rm the moment one
          # of them is edited, and then passes while removing nothing.
          leftover=$(find pr-head \
            \( -name 'CLAUDE.md' -o -name 'AGENTS.md' -o -name 'copilot-instructions.md' \
               -o -name '.claude' -o -name '.agents' -o -name '.codex' -o -name '.cursor' \) \
            -print -quit)
          if [ -n "$leftover" ]; then
            echo "instruction-shaped path survived the strip: $leftover" >&2
            echo "  --add-dir mounts pr-head as project scope, so it would reach the" >&2
            echo "  reviewer on the instruction channel." >&2
            exit 1
          fi

      - name: Mark review start
        id: t0
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: /claude-review
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Task(review-worker),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch,Task(general-purpose),Task(claude),Task(Explore),Task(Plan),Task(statusline-setup),Task(claude-code-guide),Bash,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(/home/runner/work/_actions/anthropics/claude-code-action/d535f5172dec02b204866b393d6b20b9b2aaf98d/scripts/git-push.sh:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Read(**/.git/**),Read(//proc/**),Read(~/.ssh/**),Read(~/.gitconfig),Read(~/.git-credentials),Read(~/.config/**),Read(~/.npmrc),Read(~/.docker/**),Read(~/.claude/**),Read(//home/runner/work/_temp/**)"
            --add-dir pr-head
            --add-dir /tmp/review-skill
            --add-dir /tmp/review-evidence
            --append-system-prompt-file /tmp/claude-review-prompt.md

      # A cancelled run cannot finish its own progress comment, so the checklist
      # it posted at job start would stay on the PR as if it were a live review.
      # This marks it superseded rather than deleting it. `if: cancelled()` still
      # runs on a graceful cancel.
      - name: Mark this run's progress comment superseded if it was cancelled
        if: cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.t0.outputs.at }}
        run: |
          set -uo pipefail
          [ -z "${SINCE:-}" ] && exit 0

          id=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
            | jq -r "[.[][] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | sort_by(.created_at) | last | .id // empty") || exit 0
          [ -z "$id" ] || [ "$id" = "null" ] && exit 0

          gh api -X PATCH "repos/$REPO/issues/comments/$id" \
            -f body="_Superseded: this review was cancelled because a newer commit replaced the HEAD it was reading. Any finding it posted refers to that older SHA. See the review for the current head._" \
            >/dev/null 2>&1 || true
          echo "marked comment $id as superseded"

      # A review that posts nothing still exits 0, so the check renders green and
      # `pnpm claude-gate` reads verdict=none, indistinguishable from "ran and
      # found nothing". This step reds the job unless THIS run posted a verdict.
      #
      # It filters on created_at against a timestamp taken before the action, so
      # an earlier run's verdict cannot satisfy it. Its regex mirrors
      # parseClaudeVerdict in scripts/check-claude-approval.ts: both pair ** spans
      # per line, so prose between two bold spans never counts and a bolded
      # verdict wrapped across a line break is read by neither. The parser also
      # strips backtick code spans before pairing, so a quoted glob such as
      # `app/api/**` cannot swallow the verdict's opening **; the grep does not,
      # which makes the guard NARROWER than the parser on such a line, never wider.
      # The parser reads only the LATEST claude[bot] comment, so the filter sorts
      # and takes `last`. `--slurp` is load-bearing: it makes gh emit ONE array of
      # pages, the shape `.[][]` destructures; without it `last` yields one body
      # per page. gh refuses `--slurp` together with `--jq`, so the filter is a
      # real jq.
      - name: Assert this run posted a verdict the gate can read
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.t0.outputs.at }}
        run: |
          set -euo pipefail

          if [ -z "${SINCE:-}" ]; then
            echo "FAIL: no review-start timestamp, so freshness cannot be established."
            echo "  jq compares strings, and .created_at >= \"\" is true for every comment,"
            echo "  so continuing here would silently accept a PREVIOUS run's verdict."
            exit 1
          fi

          # The action posts a progress comment at job start and EDITS the verdict
          # into it at the end, so created_at selects the comment long before its
          # body carries a verdict. Re-read rather than judging one snapshot.
          for attempt in 1 2 3 4 5; do
            # `|| fresh=""` contains a transient gh failure: under `set -euo
            # pipefail` a rate limit or 5xx would otherwise abort the step on
            # whichever attempt it lands and defeat the retry loop.
            fresh=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
              | jq -r "[.[][] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | sort_by(.created_at) | last | .body // empty") || fresh=""

            if printf '%s' "$fresh" | grep -qiE '^([^*]*\*\*[^*]*\*\*)*[^*]*\*\*[^*]*\b(approve|reject|request changes)\b[^*]*\*\*'; then
              echo "OK  this run posted a verdict (attempt $attempt)."
              exit 0
            fi
            [ "$attempt" -lt 5 ] && sleep "${VERDICT_RETRY_SLEEP:-10}"
          done
          echo "FAIL: claude-review posted no verdict on PR #$PR during this run."
          echo "  The action exits 0 regardless, so without this step the check would read"
          echo "  green while claude-gate sees verdict=none."
          echo "  Known cause: tag mode returns a progress checklist instead of a review."
          echo "  Comment /claude-review again to retry."
          exit 1
