name: Agent Eval

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # 06:00 UTC every Monday

concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Agent eval suite (Monte-Carlo prompt regression)
        run: pnpm eval:agents
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY_BUILD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-eval-result
          path: agent-eval-result.json
