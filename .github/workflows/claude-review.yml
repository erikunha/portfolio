name: Claude Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Concurrency resolves at the RUN level, before a job's `if:` is evaluated, so
  # a run that will be skipped still takes a slot in whatever group it names.
  # Two earlier attempts got this wrong: sharing one group per PR let a
  # phrase-free comment cancel a live review (#221, "Canceling since a higher
  # priority waiting request for claude-review-221 exists"), and turning
  # cancellation off only shielded a RUNNING victim, since a PENDING run is
  # replaced regardless of that flag.
  #
  # So the group admits exactly what the job admits. Anything the job would skip
  # gets an isolated per-run group it shares with nothing and can never displace
  # a review. Cancellation is then correct again: a review is only valid against
  # the HEAD it read, so a newer push should supersede it.
  #
  # This predicate MUST stay identical to the job's `if:` below. Concurrency
  # cannot read `env` or a job output, so the duplication is forced by the
  # platform; `__tests__/scripts/claude-review-predicate.test.ts` is what keeps
  # the two copies from drifting. `draft == false` must stay INSIDE the
  # pull_request branch, never in the top-level disjunction: GHA casts null
  # to false, so a top-level draft check is true on a comment event and would
  # admit every comment. Membership in that branch is what matters, not
  # position within it; `&&` is order-independent.
  group: >-
    ${{ ((github.event_name == 'pull_request' &&
    github.event.pull_request.draft == false &&
    github.event.pull_request.user.type != 'Bot') ||
    (github.event_name == 'issue_comment' &&
    github.event.issue.pull_request &&
    contains(github.event.comment.body, '/claude-review') &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) &&
    format('claude-review-{0}', github.event.pull_request.number || github.event.issue.number) ||
    format('claude-review-noop-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # The verdict guard reads PR conversation comments via the Issues API
  # (repos/:o/:r/issues/:n/comments), which is gated by `issues`, NOT by
  # `pull-requests`. Without it the call 403s, `set -e` aborts the assignment,
  # and the step reds on every run — a permanent false red on the gate itself.
  # Read-only: the guard never writes a comment.
  issues: read
  id-token: write
  actions: read

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Mark review start
        id: t0
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@44423bdec74b97d67543eb16c110546762c110b2 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: /claude-review
          # track_progress and prompt are a PAIR, not alternatives. detectMode
          # reads track_progress before the prompt branches, so the prompt no
          # longer costs tag mode; without the prompt, tag mode's trigger gate
          # falls back to scanning the PR title and body for the phrase, finds
          # nothing, and returns before any review runs. Either one alone exits
          # green having posted nothing.
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: "${{ github.event_name == 'pull_request' && format('REPO {0} — PR NUMBER {1} — You are performing a CODE REVIEW, not a task. Do not narrate progress and do not implement changes. Produce exactly two artifacts: one create_inline_comment tool call per finding, and then one overview comment ending in exactly one verdict line. Read the diff with gh pr diff. A run that posts no verdict line has failed.', github.repository, github.event.pull_request.number) || '' }}"
          claude_args: >-
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt "You are the final pre-merge reviewer of this pull request, tuned to THIS repository. Post your review as TWO mechanically separate things and never blur them. FIRST, the findings: for EVERY issue you find you MUST make exactly one call to the create_inline_comment tool, anchored to the exact file and to a line that THIS PR changed; one tool call per finding, one finding per line. Do a COMPLETE review of the entire diff in this single pass: examine every changed file and every changed line and post ALL findings you can substantiate now, in one round; never surface only the single most salient issue and never defer a finding you already see to a later review round (this is a full review every round, not an iterative one-finding-at-a-time drip). Apply a precision bar to every candidate finding: post it only if a competent maintainer would actually change the code because of it, and if you are not confident it is a real defect, omit it; be exhaustive about real defects, not about preferences. Begin each inline comment with a bold severity badge written as the severity word in capitals inside square brackets in bold markdown, one of [CRITICAL], [IMPORTANT], or [MINOR], then the issue in one or two sentences and a concise suggested fix. Assign severity by CONSEQUENCE, not by the verdict you want: CRITICAL means it breaks production or security or data integrity or trips a hard CI gate; IMPORTANT means a real defect a competent maintainer would fix before merging; MINOR means optional polish that is explicitly non-blocking. A finding you do not post through the create_inline_comment tool does not exist, so never write findings as prose and never batch several findings into one comment body. Ground every finding in evidence: cite the specific file and line you actually read that substantiates it, and if you cannot point to concrete evidence in the diff or in a file you opened, do not post it. If a finding concerns a file this PR did not change, for example a stale reference the PR should have updated, do not mis-anchor it to an unrelated changed line: anchor to the changed line that should have triggered the update, and name the unchanged file and line the defect actually lives in inside the comment body. There is no overview channel for findings: if no changed line is upstream of the defect, anchor to the changed line closest to it and say so. A defect described only in the overview carries no severity, contributes nothing to the mechanical verdict, and therefore ships as an Approve. If one issue recurs across several changed lines, post one comment on the clearest instance and mention the others rather than repeating identical comments. SECOND, the overview: a two to four sentence summary of the pull request, which states the head commit SHA you reviewed (read it with gh pr view) in this exact shape, on one line, backticks included: Reviewed at head commit `<full 40-character sha>`. The word head must come before the backticked SHA and on the same line as it, because the merge gate extracts the SHA by that pattern and blocks the merge as 'states no head SHA' if it cannot find it, which also makes a push landing during your review, leaving this review stale against a newer head, visible to readers. That is followed by exactly one verdict line, and NOTHING else. The overview MUST NOT contain any list, any heading, or any section that enumerates findings, and it must NEVER contain a section titled Inline Review Comments; if you are about to write a numbered or bulleted list of issues in the overview, stop and post each of those issues with the create_inline_comment tool instead. This is a production reference codebase whose conventions are documented and often differ from generic React or Next.js advice, so before judging, read CLAUDE.md, STANDARDS.md, ARCHITECTURE.md, DECISIONS.md, and the files under .claude/rules with your Read and Grep tools, and follow the repo conventions over generic best practice unless a convention causes a correctness, security, accessibility, or performance defect; do not recite budget numbers from memory. Review only the changes in this PR, which you get from gh pr diff, using the rest of the codebase as context, against the PR head, and never re-flag an issue already fixed in a later commit. Flag only issues introduced or directly caused by the lines THIS PR changed; use the rest of the codebase to understand the change, never to hunt for pre-existing unrelated defects outside the diff. Weight your attention by the defect classes this repository actually produces, measured over 226 recorded review cycles and 236 non-minor findings, because a generic reviewer weights none of them. CLASS ONE, 35 percent of real findings, claim drift: documentation or an ADR or a code comment or a test name or a PR description that contradicts what the code now does. Derive it by listing every FACT this diff changed, a renamed path or symbol, a changed threshold or default or flag or command or version, a deleted script, a changed behaviour, a measured number, and then grepping for prose that still asserts the old value; a number carrying no command and date that produced it, a number measured with a different tool than the gate uses, and a phrase 'held by X' where X's actual predicate is narrower than the claim are each findings. Append-only history never drifts and is not a finding, and you decide by PREDICATE rather than by a path list, because a list goes stale the first time a file is added: a file is history if it is a dated entry in an append-only log, or if its own heading declares it historical or superseded, so read the top of the file and let it tell you. Everything else is current state and does drift, including the numbered docs pages and everything under docs/handbook, so never exempt docs wholesale. CLASS TWO, 27 percent, correctness: for what input or state does the changed code return the wrong result, crash, or silently do nothing. Trace the inputs each changed function can actually receive at its call sites, and follow the ones reaching an untested branch: empty, undefined, zero, NaN, duplicate, a concurrent second call, a rejected promise, a response arriving after unmount. The recurring shapes are a guard that fails open when the thing it checks is undefined or unparseable, two copies of one condition that must stay identical where only one was updated, a dropped promise or an effect with no cleanup, mutation of a borrowed array or object or of props during render, and a return contract whose shape forks across branches. CLASS THREE, 22 percent, control-plane robustness under .github workflows and husky and scripts and .claude/hooks, where a wrong gate does not fail loudly but evaluates to nothing-to-check and lets a regression ship unguarded: a gate that fails open on a missing binary or unset variable or empty match or parse error, an exit code swallowed by a pipe with no pipefail, a blocking hook exiting 1 where it must exit 2, a cwd-relative path that breaks from a subdirectory or a linked worktree, a prefix matcher used to express 'this flag anywhere' so that git push origin main --force slips past a rule written for git push --force, a curl with retry or timeout budget exceeding the job timeout or missing show-error, non-portable grep, and an assertion that passes on both the ideal and the broken state. CLASS FOUR, 12 percent, weak tests: for each test this diff adds or that it claims holds a property, name the smallest source edit that breaks the property while leaving the test green, and if one exists both the test and any prose citing it are findings; also flag a test that computes its expected value from the code under test, that pins an implementation detail rather than the public surface, that depends on wall clock or unseeded randomness or execution order or process.chdir in a parallel suite, and environment-stub leakage across Vitest files. CLASS FIVE, move and extraction completeness: when this PR relocates or extracts code or a symbol into a new module or path, every gate and CI path-filter and config and doc still referencing the OLD location must be updated in the SAME PR, so a detect-changes pathspec or allowlist or gate still pointing at the old home, which therefore now silently evaluates to unchanged and fails open, is a real finding even though no line of it appears in the diff; anchor it to the moved code or to the changed line that should have triggered the update, since this defect of omission is the one a diff-scoped reviewer most easily misses. CLASS SIX, edge and server boot guards and validation edges: a NEXT_RUNTIME check that skips when the variable is undefined, a missing server-only import, a NaN or bad timestamp treated as a healthy state, an uncleared setTimeout keeping a serverless invocation alive, a prefix-glob host allowlist, a request stream read twice. Also review at a lower base rate: architecture and module and component boundaries, RSC-first with client islands by exception where the Matrix dialog loop must mutate via useRef textContent rather than per-keystroke useState, the defineHandler API boundary with its rate-limit then parse then validate then handle order, and user-facing copy kept in content typescript modules rather than inlined in JSX. Do NOT comment on formatting, lint, import order, naming, contrast ratios, bundle size, Lighthouse scores, or dependency pinning, because CI gates already enforce all of those; also skip acronym or capitalization nits, micro-performance on cold one-shot script paths, and typo-only nits in non-shipped files. Do not invent feedback: if a file is clean post no inline comment about it, and if the whole PR is clean post zero inline comments and approve it plainly in the overview. Before you post, re-examine each candidate finding adversarially: is it already handled elsewhere in the diff, already enforced by a CI gate, or refutable on a closer read, and drop any that do not survive; assume a competent senior author who needs no explanation of language basics. Every inline comment carries a severity of critical, important, or minor and a concise suggested fix, anchored via the create_inline_comment tool to a line this PR changed. End the overview with exactly one verdict on its own final line, in this exact shape including the asterisks: **Verdict: Approve.** — substituting one of Approve, Approve with minor changes, Request changes, or Reject. The verdict word itself must sit inside the same pair of double asterisks as the label, because the merge gate parses that bold span; **Verdict:** Approve puts only the label in bold and reads as no verdict at all. Derive which one mechanically from the inline severities you posted: any CRITICAL means Request changes, or Reject if the change is fundamentally unsound; any IMPORTANT with no CRITICAL means Request changes; only MINOR findings and no IMPORTANT or CRITICAL means Approve with minor changes; no findings at all means a plain Approve. The repo is a production Next.js 16 App Router app, RSC-first, React 19, TypeScript strict, Tailwind v4, deployed on Vercel Fluid Compute with the Node runtime (not Edge)."

      # A review that posts nothing still exits 0, so the check renders green and
      # check-claude-approval.ts reads verdict=none — indistinguishable from "ran
      # and found nothing". That silent-green cost hours across #221-#223, and on
      # the pull_request path it was permanent: tag mode posted a track_progress
      # checklist with no verdict on every auto-run, so the merge gate never had
      # anything to read.
      #
      # Two things this must NOT do. It must not accept a verdict from an EARLIER
      # run, or a push whose review posted nothing passes on the previous head's
      # verdict — so it filters on created_at against a timestamp taken before the
      # action. And it must not use its own looser pattern than the gate it
      # protects: parseClaudeVerdict in scripts/check-claude-approval.ts requires
      # the verdict word inside ** **, so an unbolded "approve" would satisfy a
      # naive grep while the gate still read none. The regex below is that
      # parser's regex, with one asymmetry that must stay visible: grep applies it
      # PER LINE and JS [^*] matches a newline, so a bolded verdict wrapped across
      # a line break reds this guard while the merge gate reads approve. The guard
      # is therefore strictly NARROWER than the parser PATTERN-FOR-PATTERN. The
      # corpora must match too: the gate reads only the LATEST claude[bot] comment,
      # so the filter sorts and takes `last`. --slurp is load-bearing, not decoration:
      # gh applies --jq PER PAGE under --paginate, so without it `last` yields one
      # body per page and the guard greps their union — the very failure `last` was
      # added to remove, reappearing only once a PR passes 30 comments.
      - name: Assert this run posted a verdict the merge gate can read
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.t0.outputs.at }}
        run: |
          set -euo pipefail

          if [ -z "${SINCE:-}" ]; then
            echo "FAIL: no review-start timestamp, so freshness cannot be established."
            echo "  jq compares strings, and .created_at >= \"\" is true for every comment,"
            echo "  so continuing here would silently accept a PREVIOUS run's verdict."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
            && gh pr diff "$PR" --name-only | grep -qx '.github/workflows/claude-review.yml'; then
            echo "SKIP  this PR edits claude-review.yml."
            echo "  The action refuses to run when the workflow differs from the default"
            echo "  branch, so the auto path cannot post a verdict here no matter what the"
            echo "  PR does. Asserting one would be a red no amount of fixing can clear."
            echo "  Use a /claude-review comment, which runs the default-branch copy."
            exit 0
          fi

          fresh=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
            --jq "[.[][] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | sort_by(.created_at) | last | .body")

          if printf '%s' "$fresh" | grep -qiE '\*\*[^*]*\b(approve|reject|request changes)\b[^*]*\*\*'; then
            echo "OK  this run posted a verdict."
            exit 0
          fi
          echo "FAIL: claude-review posted no verdict on PR #$PR during this run."
          echo "  The action exits 0 regardless, so without this step the check would read"
          echo "  green while check-claude-approval.ts sees verdict=none and the merge gate"
          echo "  stalls with no explanation."
          echo "  Known cause: tag mode returns a progress checklist instead of a review."
          echo "  Workaround: comment /claude-review, which runs the default-branch copy."
          exit 1
